name: IDOR Security Assessment Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Start original Flask application
        env:
          FLASK_SECRET_KEY: ci-test-secret-key
        run: |
          python app.py > app.log 2>&1 &
          echo $! > app.pid

          for attempt in {1..15}; do
            if curl --fail --silent http://127.0.0.1:5000/ > /dev/null; then
              echo "Flask application is ready."
              exit 0
            fi
            sleep 1
          done

          cat app.log
          echo "Flask application failed to start."
          exit 1

      - name: Run original integration tests
        run: python test_access.py

      - name: Run vulnerable and remediated assessment tests
        env:
          FLASK_SECRET_KEY: ci-test-secret-key
        run: python -m unittest -v test_assessment.py

      - name: Stop Flask application
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill "$(cat app.pid)" || true
          fi
